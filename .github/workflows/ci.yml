name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs full history to scan past commits
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest
          pip install -e .

      - name: Run pre-commit (ruff, ruff-format, mypy, gitleaks, pytest)
        run: pre-commit run --all-files --show-diff-on-failure
