[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-vnpy"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "urllib3>=1.26",
    "akshare>=1.12",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]

# ============================================================
# Ruff (linting + formatting)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Entry-point scripts legitimately set sys.path before importing
"vnpy_workspace/run.py" = ["E402"]
"import_data.py" = ["E402"]

# ============================================================
# Mypy (type checking)
# ============================================================
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
check_untyped_defs = true

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: integration/e2e tests skipped in pre-commit (run with `pytest -m slow`)",
]
